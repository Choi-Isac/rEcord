<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rEcord · 고려대학교 탄소발자국 계산기</title>
    <!-- 아이콘 (public/): ico는 오래된 브라우저, svg는 최신 브라우저, apple-touch-icon은 iPhone 홈 화면, manifest의 192·512는 Android -->
    <link rel="icon" href="favicon_crimson-dot.ico" sizes="32x32" />
    <link rel="icon" href="favicon_crimson-dot.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon_crimson-dot.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#faf8f4" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
      // 저장된 디자인 테마를 React가 뜨기 전에 적용해 색이 깜빡이지 않게 한다 (src/lib/design.jsx)
      try {
        var t = JSON.parse(localStorage.getItem("carboncalc:homeDesign"));
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
